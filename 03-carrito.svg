<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color:#f8f9fa; font-family:system-ui, sans-serif;">
  <rect x="0" y="0" width="1200" height="70" fill="#1e293b"/>
  <text x="40" y="42" fill="#ffffff" font-size="22" font-weight="bold">Aberturas Los Pampas</text>

  <text x="40" y="110" fill="#0f172a" font-size="24" font-weight="bold">Mi Carrito de Compras</text>

  <!-- Lista de Productos -->
  <rect x="40" y="140" width="720" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="60" y="160" width="110" height="90" fill="#f1f5f9" rx="4"/>
  <text x="190" y="190" fill="#0f172a" font-size="16" font-weight="bold">Ventana Corrediza Modena 150x110</text>
  <text x="190" y="215" fill="#64748b" font-size="14">Aluminio Blanco DVH</text>
  <text x="190" y="245" fill="#0284c7" font-size="16" font-weight="bold">$185.000 c/u</text>
  <rect x="520" y="185" width="100" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="535" y="208" fill="#0f172a" font-size="16">-  2  +</text>
  <text x="650" y="208" fill="#0f172a" font-size="18" font-weight="bold">$370.000</text>

  <rect x="40" y="290" width="720" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="60" y="310" width="110" height="90" fill="#f1f5f9" rx="4"/>
  <text x="190" y="340" fill="#0f172a" font-size="16" font-weight="bold">Puerta Oblak Oblakium 80x200</text>
  <text x="190" y="365" fill="#64748b" font-size="14">Inyectada PVC</text>
  <text x="190" y="395" fill="#0284c7" font-size="16" font-weight="bold">$240.000 c/u</text>
  <rect x="520" y="335" width="100" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="535" y="358" fill="#0f172a" font-size="16">-  1  +</text>
  <text x="650" y="358" fill="#0f172a" font-size="18" font-weight="bold">$240.000</text>

  <!-- Opción de Instalación -->
  <rect x="40" y="440" width="720" height="70" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="60" y="463" width="24" height="24" rx="4" fill="#16a34a"/>
  <text x="66" y="480" fill="#ffffff" font-size="16" font-weight="bold">✓</text>
  <text x="100" y="480" fill="#166534" font-size="15" font-weight="bold">Solicitar servicio de colocación e instalación técnica en obra</text>

  <!-- Resumen de Pedido -->
  <rect x="800" y="140" width="360" height="370" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="830" y="180" fill="#0f172a" font-size="18" font-weight="bold">Resumen de Compra</text>
  <line x1="830" y1="195" x2="1130" y2="195" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="830" y="230" fill="#475569" font-size="14">Subtotal Productos:</text>
  <text x="1040" y="230" fill="#0f172a" font-size="14">$610.000</text>

  <text x="830" y="265" fill="#475569" font-size="14">Servicio de Instalación:</text>
  <text x="1050" y="265" fill="#0f172a" font-size="14">$45.000</text>

  <text x="830" y="300" fill="#475569" font-size="14">Envío estimado:</text>
  <text x="1060" y="300" fill="#16a34a" font-size="14">Gratis</text>

  <line x1="830" y1="330" x2="1130" y2="330" stroke="#e2e8f0" stroke-width="1"/>
  <text x="830" y="370" fill="#0f172a" font-size="20" font-weight="bold">Total:</text>
  <text x="1020" y="370" fill="#0284c7" font-size="22" font-weight="bold">$655.000</text>

  <rect x="830" y="420" width="300" height="50" rx="6" fill="#0284c7"/>
  <text x="890" y="451" fill="#ffffff" font-size="16" font-weight="bold">Proceder al Checkout</text>
</svg>
